<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="nplusone — catch N+1 queries in Node.js at runtime">
  <title>nplusone — catch N+1 queries in Node.js at runtime</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#11151D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F85149"/>
      <stop offset="100%" stop-color="#FF8B84"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F85149" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#F85149" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F85149" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="14" fill="url(#dots)"/>
  <ellipse cx="900" cy="200" rx="460" ry="330" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <!-- ── left column ─────────────────────────────────────────────── -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <g transform="translate(56, 60)">
      <rect x="0" y="0" width="204" height="28" rx="14" fill="#F85149" fill-opacity="0.12" stroke="#F85149" stroke-opacity="0.32"/>
      <text x="102" y="19" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FF8B84" letter-spacing="1.5">QUERY PERFORMANCE</text>
    </g>

    <text x="54" y="170" font-size="64" font-weight="800" letter-spacing="-2" fill="#E6EDF3">nplus<tspan fill="url(#accent)">one</tspan></text>

    <text x="56" y="214" font-size="22" font-weight="600" fill="#C9D1D9">Catch N+1 queries in Node.js at runtime.</text>
    <text x="56" y="244" font-size="16.5" fill="#8B949E">Fail your CI before they reach production.</text>

    <g font-size="14.5" fill="#8B949E">
      <g transform="translate(56, 292)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#3FB950"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Points at your code. </tspan>Not “51 queries ran”.</text>
      </g>
      <g transform="translate(56, 322)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#3FB950"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Works with your ORM. </tspan>It watches the driver.</text>
      </g>
      <g transform="translate(56, 352)">
        <circle cx="4" cy="-4.5" r="3.2" fill="#3FB950"/>
        <text x="20" y="0" xml:space="preserve"><tspan fill="#C9D1D9" font-weight="600">Zero dependencies. </tspan>Off in production.</text>
      </g>
    </g>

    <g transform="translate(56, 400)" font-size="12" font-weight="600" fill="#8B949E">
      <g>
        <rect x="0" y="0" width="88" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="44" y="17.5" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(96, 0)">
        <rect x="0" y="0" width="62" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="31" y="17.5" text-anchor="middle">MySQL</text>
      </g>
      <g transform="translate(166, 0)">
        <rect x="0" y="0" width="62" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="31" y="17.5" text-anchor="middle">SQLite</text>
      </g>
      <g transform="translate(236, 0)">
        <rect x="0" y="0" width="74" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="37" y="17.5" text-anchor="middle">MongoDB</text>
      </g>
      <g transform="translate(318, 0)">
        <rect x="0" y="0" width="58" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="29" y="17.5" text-anchor="middle">Prisma</text>
      </g>
      <g transform="translate(384, 0)">
        <rect x="0" y="0" width="60" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
        <text x="30" y="17.5" text-anchor="middle">Drizzle</text>
      </g>
    </g>
  </g>

  <!-- ── right column: the report ────────────────────────────────── -->
  <g transform="translate(608, 60)">
    <rect x="0" y="0" width="536" height="292" rx="11" fill="#010409" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.11"/>

    <circle cx="20" cy="21" r="5" fill="#FF5F57"/>
    <circle cx="38" cy="21" r="5" fill="#FEBC2E"/>
    <circle cx="56" cy="21" r="5" fill="#28C840"/>
    <line x1="0" y1="42" x2="536" y2="42" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
      <text x="22" y="74" fill="#6E7681">$ <tspan fill="#C9D1D9">npm test</tspan></text>

      <text x="22" y="112" fill="#8B949E"><tspan fill="#E6EDF3" font-weight="700">nplusone</tspan> 1 finding in <tspan fill="#E6EDF3" font-weight="700">GET /orders</tspan></text>
      <text x="22" y="131" fill="#6E7681">51 queries, 840ms</text>

      <text x="38" y="169" fill="#F85149" font-weight="700">N+1 query  <tspan fill="#E6EDF3">50×</tspan><tspan fill="#C9D1D9" font-weight="400"> SELECT * FROM items</tspan></text>
      <text x="139" y="188" fill="#C9D1D9">WHERE order_id = ?</text>

      <text x="54" y="214" fill="#6E7681">at <tspan fill="#58A6FF">src/routes/orders.ts:47</tspan>  (loadOrdersPage)</text>
      <text x="54" y="233" fill="#6E7681">612ms spent here</text>

      <text x="22" y="266" fill="#F85149">✗<tspan fill="#8B949E">  orders page does not N+1</tspan></text>
    </g>
  </g>

  <!-- the shape of the bug: one parent query, N children -->
  <g transform="translate(608, 382)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#6E7681" letter-spacing="1.2">ONE QUERY IN, FIFTY OUT</text>
    <rect x="0" y="16" width="48" height="9" rx="4.5" fill="#3FB950" opacity="0.9"/>
    <g fill="#F85149">
      <rect x="58" y="16" width="30" height="9" rx="4.5" opacity="0.82"/>
      <rect x="94" y="16" width="30" height="9" rx="4.5" opacity="0.76"/>
      <rect x="130" y="16" width="30" height="9" rx="4.5" opacity="0.70"/>
      <rect x="166" y="16" width="30" height="9" rx="4.5" opacity="0.63"/>
      <rect x="202" y="16" width="30" height="9" rx="4.5" opacity="0.56"/>
      <rect x="238" y="16" width="30" height="9" rx="4.5" opacity="0.49"/>
      <rect x="274" y="16" width="30" height="9" rx="4.5" opacity="0.42"/>
      <rect x="310" y="16" width="30" height="9" rx="4.5" opacity="0.35"/>
      <rect x="346" y="16" width="30" height="9" rx="4.5" opacity="0.28"/>
      <rect x="382" y="16" width="30" height="9" rx="4.5" opacity="0.22"/>
      <rect x="418" y="16" width="30" height="9" rx="4.5" opacity="0.16"/>
      <rect x="454" y="16" width="30" height="9" rx="4.5" opacity="0.11"/>
      <rect x="490" y="16" width="30" height="9" rx="4.5" opacity="0.07"/>
    </g>
  </g>
</svg>
