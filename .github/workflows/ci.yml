name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest release with node:sqlite, which the integration
        # tests use; 24 is current.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Bun and Deno both run a lot of Node server code, and the answer to "does
  # this work there" should not rot back into "nobody knows". See #27.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci
      # The suite is TypeScript; compile it once with tsc and let Deno run the
      # output, so both runtimes are testing the same thing.
      - run: npx tsc -p tsconfig.json
      - run: deno test -A --no-check dist-test/test/

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: npx tsc -p tsconfig.json

      - name: Test
        # Three files are held out, for two reasons that are Bun's rather than
        # this package's:
        #   sqlite, kysely — `node:sqlite` is not implemented in Bun 1.3, so
        #     the files cannot even load.
        #   drizzle        — JavaScriptCore eliminates the frame for an inlined
        #     or tail-position call, and those tests assert on exactly that
        #     frame. Documented in the README's runtime table.
        run: |
          bun test $(ls dist-test/test/*.test.js \
            | grep -vE 'dist-test/test/(sqlite|kysely|drizzle)\.test\.js$')
